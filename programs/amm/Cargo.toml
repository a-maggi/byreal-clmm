[package]
name = "byreal-clmm"
version = "0.1.0"
description = "Anchor client and source for Byreal concentrated liquidity AMM"
edition = "2021"
keywords = ["solana", "anchor", "byreal"]

[lib]
crate-type = ["cdylib", "lib"]
name = "byreal_clmm"
doctest = false

[features]
no-entrypoint = []
no-idl = []
cpi = ["no-entrypoint"]
default = []
client = []
no-log-ix-name = []
enable-log = []
localnet = []
devnet = []
paramset = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
test-utils = []
# On-chain dynamic-fee oracle path (swap_v3_dyn + pyth). NOT buildable on this
# fork's dep set: pyth 1.0.0 is compiled against crates-io anchor 0.31 /
# solana-program 2.x, whose types cannot mix with the git anchor 0.32 /
# solana 3 pins above. Enabling it requires reverting to upstream's crates-io
# anchor pins. The fork's consumer (mev-bot) never executes swap_v3_dyn.
dynamic-fee-oracle = ["dep:pyth-solana-receiver-sdk"]

[dependencies]
anchor-lang = { git = "https://github.com/solana-foundation/anchor.git", rev = "2dd5c2473f7964e080f5fa3bc06aa445c07396db", features = ["init-if-needed"] }
anchor-spl = { git = "https://github.com/solana-foundation/anchor.git", rev = "2dd5c2473f7964e080f5fa3bc06aa445c07396db", features = ["metadata", "memo"] }
spl-token-2022 = { version = "10.0.0", features = ["no-entrypoint"] }
uint = { git = "https://github.com/raydium-io/parity-common", package = "uint" }
bytemuck = { version = "1.19.0", features = ["derive", "min_const_generics"] }
arrayref = { version = "0.3.6" }
solana-security-txt = "1.1.1"
# Pinned to match anchor 0.31.1
pyth-solana-receiver-sdk = { version = "=1.0.0", optional = true }

[dev-dependencies]
quickcheck = "0.9"
proptest = "1.0"
rand = "0.8.5"
